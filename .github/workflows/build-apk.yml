name: Build Android AAB and APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build Android AAB & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Create Release Signing Keystore
        run: |
          cd android/app
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias reps-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass repsappkey123 \
            -keypass repsappkey123 \
            -dname "CN=REPS Pushups, OU=App, O=Axxio, L=Paris, ST=IDF, C=FR"

      - name: Build Signed AAB and APK with Gradle
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease assembleDebug --stacktrace

      - name: Organize Build Outputs
        run: |
          mkdir -p build-output
          # Locate and copy release AAB (Required for Google Play Console)
          if [ -f "android/app/build/outputs/bundle/release/app-release.aab" ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab build-output/REPS-com.axxio.reps-release.aab
          fi
          # Copy release and debug APKs for direct testing
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk build-output/REPS-com.axxio.reps-release.apk
          elif [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk build-output/REPS-com.axxio.reps-debug.apk
          fi

      - name: Upload Artifacts (AAB for Google Play & APK for testing)
        uses: actions/upload-artifact@v4
        with:
          name: Reps-GooglePlay-AAB-and-APK
          path: build-output/*
          retention-days: 30

      - name: Create GitHub Release
        if: github.event.inputs.create_release == 'true' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: REPS Android Release ${{ github.ref_name || 'v1.0.0' }}
          files: build-output/*
          draft: false
          prerelease: false
          generate_release_notes: true
