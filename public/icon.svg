<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border -->
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#27272a" stroke-width="8"/>

  <!-- Glowing Flame Badge -->
  <g transform="translate(128, 110) scale(1.05)" filter="url(#glow)">
    <path d="M120 0C120 0 145 45 145 95C145 130 125 155 125 155C125 155 138 125 130 100C118 135 95 160 95 190C95 225 120 250 120 250C120 250 50 240 50 165C50 105 100 50 100 50C100 50 85 90 95 115C105 80 120 0 120 0Z" fill="url(#flameGrad)" />
    <!-- Secondary inner flame core -->
    <path d="M120 95C120 95 135 125 135 155C135 175 120 190 120 190C120 190 127 170 122 155C115 175 102 190 102 210C102 230 118 245 118 245C118 245 75 238 75 188C75 148 107 115 107 115C107 115 98 140 105 155C111 135 120 95 120 95Z" fill="#facc15" opacity="0.9" />
  </g>

  <!-- Pushup Athlete silhouette accent at the bottom -->
  <g transform="translate(126, 385)" fill="#e4e4e7">
    <!-- Base text or bar -->
    <rect x="16" y="16" width="228" height="14" rx="7" fill="#10b981" />
  </g>
</svg>
